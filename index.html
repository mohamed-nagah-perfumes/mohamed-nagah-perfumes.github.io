<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محمد نجاح للعطور</title><link rel="stylesheet" href="main.css"></head><body><div id="root"></div><script>
window.__errs=[];
window.addEventListener('error',function(e){window.__errs.push((e.message||'err')+' @'+(e.filename||'')+':'+(e.lineno||''));document.title='ERR '+window.__errs[0];});
window.addEventListener('unhandledrejection',function(e){window.__errs.push('rej: '+((e.reason&&e.reason.message)||e.reason));document.title='REJ '+window.__errs[0];});
window.instinctFile = window.instinctFile || {
  initialRoute: location.pathname + location.search + location.hash,
  route: function () {},
  ready: true
};
</script><script src="main.js"></script></body></html>
